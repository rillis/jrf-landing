{% extends "base.html" %}
{% block title %}Página não encontrada — {{ site.nome }}{% endblock %}
{% block content %}
<section class="pagina pagina--centro">
  <div class="wrap estreito">
    <p class="selo">Erro 404</p>
    <h1>Página não encontrada</h1>
    <p class="pagina__intro">O endereço que você acessou não existe.</p>
    <div class="pagina__cta">
      <a class="btn" href="{{ url_for('index') }}">Voltar ao início</a>
    </div>
  </div>
</section>
{% endblock %}
